openapi: 3.0.3
info:
  title: Motoryx API
  version: 1.0.0
  description: "OpenAPI definition for the Motoryx Laravel API. Import this file into Postman and set the server URL, X-Tenant header, and bearer token as needed. For the seeded local demo tenant, use X-Tenant: autodeal."
servers:
  - url: http://localhost:8000/api
    description: Local Laravel server
tags:
  - name: Auth
  - name: Lookups
  - name: Cars
  - name: Customers
  - name: Leads
  - name: Quotations
  - name: Sales
  - name: Reservations
  - name: Notifications
  - name: Dashboard
  - name: Branches
  - name: Users
security:
  - bearerAuth: []
    tenantHeader: []
paths:
  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: "Login requires the X-Tenant header. In the seeded local database, use X-Tenant `autodeal` with `admin@autodeal.com` / `12345678`."
      security:
        - tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              seededAdmin:
                summary: Seeded local admin
                value:
                  email: admin@autodeal.com
                  password: '12345678'
                  device_name: postman
      responses:
        '200':
          description: Logged in successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/User'
                          token:
                            type: string
                          expires_at:
                            type: string
                            format: date-time
        '400':
          description: Tenant header missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Tenant not specified.
                errors: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Tenant or user account is suspended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: This account is suspended.
                errors: null
        '404':
          description: Tenant slug not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Tenant not found.
                errors: null
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout current token
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/me:
    get:
      tags: [Auth]
      summary: Get authenticated user
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
  /v1/auth/profile:
    put:
      tags: [Auth]
      summary: Update authenticated user profile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/auth/password:
    put:
      tags: [Auth]
      summary: Change authenticated user password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/lookups/brands:
    get:
      tags: [Lookups]
      summary: List brands with models
      security:
        - tenantHeader: []
      responses:
        '200':
          description: Brands list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/BrandWithModels'
  /v1/lookups/brands/{brand}/models:
    get:
      tags: [Lookups]
      summary: List models for a brand
      security:
        - tenantHeader: []
      parameters:
        - $ref: '#/components/parameters/BrandId'
      responses:
        '200':
          description: Models list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/IdName'
  /v1/lookups/categories:
    get:
      tags: [Lookups]
      summary: List vehicle categories
      security:
        - tenantHeader: []
      responses:
        '200':
          $ref: '#/components/responses/IdNameList'
  /v1/lookups/features:
    get:
      tags: [Lookups]
      summary: List car features
      security:
        - tenantHeader: []
      responses:
        '200':
          $ref: '#/components/responses/IdNameList'
  /v1/lookups/enums:
    get:
      tags: [Lookups]
      summary: List enum values used by forms
      security:
        - tenantHeader: []
      responses:
        '200':
          description: Enum values.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EnumLookups'

  /v1/cars:
    get:
      tags: [Cars]
      summary: List cars
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - name: brand_id
          in: query
          schema: { type: integer }
        - name: model_id
          in: query
          schema: { type: integer }
        - name: category_id
          in: query
          schema: { type: integer }
        - name: year_from
          in: query
          schema: { type: integer, minimum: 1950 }
        - name: year_to
          in: query
          schema: { type: integer, minimum: 1950 }
        - name: price_from
          in: query
          schema: { type: number, minimum: 0 }
        - name: price_to
          in: query
          schema: { type: number, minimum: 0 }
        - name: fuel_type
          in: query
          schema: { $ref: '#/components/schemas/FuelType' }
        - name: transmission
          in: query
          schema: { $ref: '#/components/schemas/Transmission' }
        - name: condition
          in: query
          schema: { $ref: '#/components/schemas/CarCondition' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CarStatus' }
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Paginated cars.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCarsResponse'
    post:
      tags: [Cars]
      summary: Create a car
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CarUpsertRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/CarUpsertRequest'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/cars/{id}:
    get:
      tags: [Cars]
      summary: Get car details
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Car details.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Car'
    post:
      tags: [Cars]
      summary: Update a car
      description: Uses POST to support multipart/form-data uploads.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CarUpdateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/CarUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Cars]
      summary: Delete a car
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/cars/{id}/publish:
    post:
      tags: [Cars]
      summary: Publish a car
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /v1/cars/{car}/images/{image}:
    delete:
      tags: [Cars]
      summary: Delete a car image
      parameters:
        - name: car
          in: path
          required: true
          schema: { type: integer }
        - name: image
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          $ref: '#/components/responses/Deleted'

  /v1/customers:
    get:
      tags: [Customers]
      summary: List customers
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Paginated customers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCustomersResponse'
    post:
      tags: [Customers]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/customers/{customer}:
    get:
      tags: [Customers]
      summary: Get customer details
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    put:
      tags: [Customers]
      summary: Update a customer
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags: [Customers]
      summary: Partially update a customer
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    delete:
      tags: [Customers]
      summary: Delete a customer
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          $ref: '#/components/responses/Deleted'

  /v1/leads:
    get:
      tags: [Leads]
      summary: List leads
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/LeadStatus' }
        - name: assigned_to
          in: query
          schema: { type: integer }
        - name: source
          in: query
          schema: { type: string, maxLength: 50 }
      responses:
        '200':
          $ref: '#/components/responses/Paginated'
    post:
      tags: [Leads]
      summary: Create a lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/leads/{id}:
    get:
      tags: [Leads]
      summary: Get lead details
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    put:
      tags: [Leads]
      summary: Update a lead
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Leads]
      summary: Delete a lead
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
  /v1/leads/{id}/activities:
    post:
      tags: [Leads]
      summary: Add a lead activity
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadActivityRequest'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/quotations:
    get:
      tags: [Quotations]
      summary: List quotations
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/QuotationStatus' }
      responses:
        '200':
          $ref: '#/components/responses/Paginated'
    post:
      tags: [Quotations]
      summary: Create a quotation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotationCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/quotations/{id}:
    get:
      tags: [Quotations]
      summary: Get quotation details
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /v1/quotations/{id}/status:
    patch:
      tags: [Quotations]
      summary: Update quotation status
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotationStatusRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/sales:
    get:
      tags: [Sales]
      summary: List sales
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/SaleStatus' }
        - name: salesperson_id
          in: query
          schema: { type: integer }
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          $ref: '#/components/responses/Paginated'
    post:
      tags: [Sales]
      summary: Create a sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/sales/{id}:
    get:
      tags: [Sales]
      summary: Get sale details
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /v1/sales/{id}/cancel:
    patch:
      tags: [Sales]
      summary: Cancel a sale
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/sales/{id}/payments:
    post:
      tags: [Sales]
      summary: Add sale payment
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/reservations:
    get:
      tags: [Reservations]
      summary: List reservations
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ReservationStatus' }
      responses:
        '200':
          $ref: '#/components/responses/Paginated'
    post:
      tags: [Reservations]
      summary: Create a reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/reservations/{id}:
    get:
      tags: [Reservations]
      summary: Get reservation details
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /v1/reservations/{id}/status:
    patch:
      tags: [Reservations]
      summary: Update reservation status
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationStatusRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/notifications:
    get:
      tags: [Notifications]
      summary: List notifications
      parameters:
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          $ref: '#/components/responses/Paginated'
  /v1/notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all notifications as read
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /v1/notifications/{id}:
    delete:
      tags: [Notifications]
      summary: Delete a notification
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
  /v1/notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark notification as read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /v1/dashboard:
    get:
      tags: [Dashboard]
      summary: Get dashboard KPIs
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [week, month, year]
            default: month
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /v1/branches:
    get:
      tags: [Branches]
      summary: List branches
      responses:
        '200':
          $ref: '#/components/responses/Success'
    post:
      tags: [Branches]
      summary: Create a branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/branches/{branch}:
    get:
      tags: [Branches]
      summary: Get branch details
      parameters:
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    put:
      tags: [Branches]
      summary: Update a branch
      parameters:
        - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags: [Branches]
      summary: Partially update a branch
      parameters:
        - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    delete:
      tags: [Branches]
      summary: Delete a branch
      parameters:
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/users:
    get:
      tags: [Users]
      summary: List users
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/UserStatus' }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/UserRole' }
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/Paginated'
    post:
      tags: [Users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/users/{id}:
    get:
      tags: [Users]
      summary: Get user details
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    put:
      tags: [Users]
      summary: Update a user
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Users]
      summary: Delete a user
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/users/{id}/reset-password:
    patch:
      tags: [Users]
      summary: Reset user password
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
    tenantHeader:
      type: apiKey
      in: header
      name: X-Tenant
      description: "Tenant slug resolved from the tenants table. Seeded local demo value: autodeal."
  parameters:
    TenantHeader:
      name: X-Tenant
      in: header
      required: true
      description: Tenant slug. Use `autodeal` for the seeded local demo tenant.
      schema:
        type: string
        example: autodeal
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    BrandId:
      name: brand
      in: path
      required: true
      schema: { type: integer }
    BranchId:
      name: branch
      in: path
      required: true
      schema: { type: integer }
    CustomerId:
      name: customer
      in: path
      required: true
      schema: { type: integer }
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 15
  responses:
    Success:
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
    Created:
      description: Created successfully.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
    Deleted:
      description: Deleted successfully.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
    Paginated:
      description: Paginated response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaginatedResponse'
    IdNameList:
      description: List of id/name records.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessResponse'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IdName'
    Unauthorized:
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Success
        data:
          nullable: true
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: object
          nullable: true
          additionalProperties:
            type: array
            items:
              type: string
    PaginatedResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items: {}
            meta:
              $ref: '#/components/schemas/PaginationMeta'
            links:
              $ref: '#/components/schemas/PaginationLinks'
    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        from: { type: integer, nullable: true }
        to: { type: integer, nullable: true }
    PaginationLinks:
      type: object
      properties:
        first: { type: string, nullable: true }
        last: { type: string, nullable: true }
        prev: { type: string, nullable: true }
        next: { type: string, nullable: true }
    PaginatedCarsResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Car'
    PaginatedCustomersResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Customer'

    IdName:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
    BrandWithModels:
      allOf:
        - $ref: '#/components/schemas/IdName'
        - type: object
          properties:
            logo: { type: string, nullable: true }
            models:
              type: array
              items:
                $ref: '#/components/schemas/IdName'
    FuelType:
      type: string
      enum: [petrol, diesel, electric, hybrid]
    Transmission:
      type: string
      enum: [manual, automatic, cvt]
    CarCondition:
      type: string
      enum: [new, used, certified]
    CarStatus:
      type: string
      enum: [available, reserved, sold, inactive]
    LeadSource:
      type: string
      enum: [website, walk_in, phone, social_media, referral, other]
    LeadStatus:
      type: string
      enum: [new, contacted, qualified, negotiating, won, lost]
    LeadActivity:
      type: string
      enum: [call, email, meeting, note, status_change, other]
    SaleStatus:
      type: string
      enum: [pending, completed, cancelled, refunded]
    PaymentMethod:
      type: string
      enum: [cash, bank_transfer, check, card]
    QuotationStatus:
      type: string
      enum: [draft, sent, accepted, rejected, expired]
    ReservationStatus:
      type: string
      enum: [pending, confirmed, cancelled, completed]
    UserRole:
      type: string
      enum: [manager, agent]
    UserStatus:
      type: string
      enum: [active, inactive, suspended]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: manager@example.com
        password:
          type: string
          format: password
          maxLength: 255
          example: password
        device_name:
          type: string
          nullable: true
          maxLength: 100
          example: postman
    ProfileUpdateRequest:
      type: object
      properties:
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        phone: { type: string, nullable: true, maxLength: 30 }
        avatar:
          type: string
          format: binary
          nullable: true
    PasswordChangeRequest:
      type: object
      required: [current_password, password, password_confirmation]
      properties:
        current_password: { type: string, format: password }
        password: { type: string, format: password, minLength: 8 }
        password_confirmation: { type: string, format: password, minLength: 8 }
    PasswordResetRequest:
      type: object
      required: [password, password_confirmation]
      properties:
        password: { type: string, format: password, minLength: 8 }
        password_confirmation: { type: string, format: password, minLength: 8 }

    CarFields:
      type: object
      properties:
        branch_id: { type: integer }
        brand_id: { type: integer }
        model_id: { type: integer }
        category_id: { type: integer, nullable: true }
        vin: { type: string, nullable: true, minLength: 17, maxLength: 17 }
        registration_number: { type: string, nullable: true, maxLength: 50 }
        year: { type: integer, nullable: true, minimum: 1950 }
        color: { type: string, nullable: true, maxLength: 50 }
        fuel_type:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/FuelType'
        transmission:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Transmission'
        mileage: { type: integer, nullable: true, minimum: 0, maximum: 9999999 }
        engine_size: { type: number, nullable: true, minimum: 0, maximum: 20 }
        horsepower: { type: integer, nullable: true, minimum: 0, maximum: 5000 }
        seats: { type: integer, nullable: true, minimum: 1, maximum: 50 }
        doors: { type: integer, nullable: true, minimum: 1, maximum: 10 }
        condition:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CarCondition'
        purchase_price: { type: number, nullable: true, minimum: 0 }
        selling_price: { type: number, nullable: true, minimum: 0 }
        discounted_price: { type: number, nullable: true, minimum: 0 }
        description: { type: string, nullable: true, maxLength: 5000 }
        status:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CarStatus'
        published_at: { type: string, format: date-time, nullable: true }
        feature_ids:
          type: array
          nullable: true
          items: { type: integer }
        images:
          type: array
          nullable: true
          maxItems: 10
          items:
            type: string
            format: binary
    CarUpsertRequest:
      allOf:
        - $ref: '#/components/schemas/CarFields'
      required: [branch_id, brand_id, model_id]
    CarUpdateRequest:
      $ref: '#/components/schemas/CarFields'
    Car:
      type: object
      properties:
        id: { type: integer }
        brand: { $ref: '#/components/schemas/IdName' }
        model: { $ref: '#/components/schemas/IdName' }
        category: { $ref: '#/components/schemas/IdName', nullable: true }
        year: { type: integer, nullable: true }
        color: { type: string, nullable: true }
        fuel_type: { $ref: '#/components/schemas/FuelType' }
        transmission: { $ref: '#/components/schemas/Transmission' }
        mileage: { type: integer, nullable: true }
        condition: { $ref: '#/components/schemas/CarCondition' }
        selling_price: { type: number, nullable: true }
        discounted_price: { type: number, nullable: true }
        effective_price: { type: number, nullable: true }
        status: { $ref: '#/components/schemas/CarStatus' }
        published_at: { type: string, format: date-time, nullable: true }
        primary_image: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    CustomerFields:
      type: object
      properties:
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        phone: { type: string, nullable: true, maxLength: 30 }
        email: { type: string, format: email, nullable: true, maxLength: 255 }
        address: { type: string, nullable: true, maxLength: 500 }
        city: { type: string, nullable: true, maxLength: 100 }
        notes: { type: string, nullable: true, maxLength: 2000 }
    CustomerCreateRequest:
      allOf:
        - $ref: '#/components/schemas/CustomerFields'
      required: [first_name, last_name]
    CustomerUpdateRequest:
      $ref: '#/components/schemas/CustomerFields'
    Customer:
      type: object
      properties:
        id: { type: integer }
        full_name: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        city: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    LeadCreateRequest:
      type: object
      required: [customer_id]
      properties:
        customer_id: { type: integer }
        assigned_to: { type: integer, nullable: true }
        source:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LeadSource'
        status:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LeadStatus'
        notes: { type: string, nullable: true, maxLength: 2000 }
    LeadUpdateRequest:
      type: object
      properties:
        assigned_to: { type: integer, nullable: true }
        source:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LeadSource'
        status:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LeadStatus'
        notes: { type: string, nullable: true, maxLength: 2000 }
    LeadActivityRequest:
      type: object
      required: [activity]
      properties:
        activity: { $ref: '#/components/schemas/LeadActivity' }
        notes: { type: string, nullable: true, maxLength: 2000 }

    QuotationCreateRequest:
      type: object
      required: [customer_id, salesperson_id, items]
      properties:
        customer_id: { type: integer }
        salesperson_id: { type: integer }
        valid_until: { type: string, format: date, nullable: true }
        status:
          type: string
          nullable: true
          enum: [draft, sent]
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [car_id]
            properties:
              car_id: { type: integer }
              discount: { type: number, nullable: true, minimum: 0 }
    QuotationStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/QuotationStatus' }

    SaleCreateRequest:
      type: object
      required: [customer_id, car_id, salesperson_id, sale_date, vehicle_price]
      properties:
        customer_id: { type: integer }
        car_id: { type: integer }
        salesperson_id: { type: integer }
        sale_date: { type: string, format: date }
        vehicle_price: { type: number, minimum: 0 }
        discount: { type: number, nullable: true, minimum: 0 }
    PaymentRequest:
      type: object
      required: [payment_date, amount, payment_method]
      properties:
        payment_date: { type: string, format: date }
        amount: { type: number, minimum: 0.01 }
        payment_method: { $ref: '#/components/schemas/PaymentMethod' }
        reference: { type: string, nullable: true, maxLength: 100 }
        notes: { type: string, nullable: true, maxLength: 500 }

    ReservationCreateRequest:
      type: object
      required: [customer_id, car_id, reservation_date]
      properties:
        customer_id: { type: integer }
        car_id: { type: integer }
        reservation_date: { type: string, format: date-time }
        deposit_amount: { type: number, nullable: true, minimum: 0 }
        notes: { type: string, nullable: true, maxLength: 1000 }
    ReservationStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ReservationStatus' }

    BranchFields:
      type: object
      properties:
        name: { type: string, maxLength: 150 }
        phone: { type: string, nullable: true, maxLength: 30 }
        email: { type: string, format: email, nullable: true, maxLength: 255 }
        address: { type: string, nullable: true, maxLength: 500 }
        city: { type: string, nullable: true, maxLength: 100 }
        latitude: { type: number, nullable: true, minimum: -90, maximum: 90 }
        longitude: { type: number, nullable: true, minimum: -180, maximum: 180 }
        is_active: { type: boolean, nullable: true }
    BranchCreateRequest:
      allOf:
        - $ref: '#/components/schemas/BranchFields'
      required: [name]
    BranchUpdateRequest:
      $ref: '#/components/schemas/BranchFields'

    UserCreateRequest:
      type: object
      required: [first_name, last_name, email, password, role]
      properties:
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        phone: { type: string, nullable: true, maxLength: 30 }
        password: { type: string, format: password, minLength: 8 }
        role: { $ref: '#/components/schemas/UserRole' }
        branch_id: { type: integer, nullable: true }
        status:
          type: string
          nullable: true
          enum: [active, inactive]
    UserUpdateRequest:
      type: object
      properties:
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        phone: { type: string, nullable: true, maxLength: 30 }
        role: { $ref: '#/components/schemas/UserRole' }
        branch_id: { type: integer, nullable: true }
        status: { $ref: '#/components/schemas/UserStatus' }
    User:
      type: object
      properties:
        id: { type: integer }
        full_name: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/UserStatus' }
        avatar: { type: string, nullable: true }
        branch:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/IdName'
        tenant_id: { type: integer }
        created_at: { type: string, format: date-time }
    EnumLookups:
      type: object
      properties:
        fuel_types:
          type: array
          items: { $ref: '#/components/schemas/FuelType' }
        transmissions:
          type: array
          items: { $ref: '#/components/schemas/Transmission' }
        conditions:
          type: array
          items: { $ref: '#/components/schemas/CarCondition' }
        car_statuses:
          type: array
          items: { $ref: '#/components/schemas/CarStatus' }
        lead_sources:
          type: array
          items: { $ref: '#/components/schemas/LeadSource' }
        lead_statuses:
          type: array
          items: { $ref: '#/components/schemas/LeadStatus' }
        lead_activities:
          type: array
          items: { $ref: '#/components/schemas/LeadActivity' }
        sale_statuses:
          type: array
          items: { $ref: '#/components/schemas/SaleStatus' }
        payment_methods:
          type: array
          items: { $ref: '#/components/schemas/PaymentMethod' }
        quotation_statuses:
          type: array
          items: { $ref: '#/components/schemas/QuotationStatus' }
        reservation_statuses:
          type: array
          items: { $ref: '#/components/schemas/ReservationStatus' }
        user_roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
        user_statuses:
          type: array
          items: { $ref: '#/components/schemas/UserStatus' }
